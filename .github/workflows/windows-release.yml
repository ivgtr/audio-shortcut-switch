name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain 1.99.1
      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo +1.99.1 metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'audio-shortcut-switch' })
          if ($package.Count -ne 1) { throw 'Could not determine the app version' }
          $version = $package[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
          if ((Get-Content README-release.txt -TotalCount 1) -ne "Audio Shortcut Switch $version (Windows 10/11 x64)") {
            throw 'Release README version does not match Cargo version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_name=AudioShortcutSwitch-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
      - name: Test
        shell: pwsh
        run: cargo +1.99.1 test --locked
      - name: Verify Rust dependency notices
        shell: pwsh
        run: python scripts/generate_rust_licenses.py --check
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=/src --remap-path-prefix=$env:USERPROFILE=/rust"
          cargo +1.99.1 build --release --locked --target x86_64-pc-windows-msvc
      - name: Download pinned helper tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/shunf4/ToothTrayCli/releases/download/0.2-cli-20260701/ToothTrayCLI.zip' -OutFile "$env:RUNNER_TEMP\ToothTrayCLI.zip"
          Invoke-WebRequest 'https://www.nirsoft.net/utils/soundvolumeview-x64.zip' -OutFile "$env:RUNNER_TEMP\soundvolumeview-x64.zip"
      - name: Package verified release
        shell: pwsh
        run: |
          python scripts/package_release.py `
            --exe target/x86_64-pc-windows-msvc/release/audio-shortcut-switch.exe `
            --toothtray-zip "$env:RUNNER_TEMP\ToothTrayCLI.zip" `
            --soundvolumeview-zip "$env:RUNNER_TEMP\soundvolumeview-x64.zip" `
            --output "dist/${{ steps.version.outputs.asset_name }}"
          $hash = (Get-FileHash "dist/${{ steps.version.outputs.asset_name }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: AudioShortcutSwitch-${{ steps.version.outputs.version }}-win-x64
          path: dist/${{ steps.version.outputs.asset_name }}
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "dist/${{ steps.version.outputs.asset_name }}" `
            --verify-tag `
            --title "Audio Shortcut Switch ${{ steps.version.outputs.version }}" `
            --notes-file README-release.txt
