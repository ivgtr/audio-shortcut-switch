[package]
name = "audio-shortcut-switch"
version = "0.3.2"
edition = "2024"
rust-version = "1.99"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["combobox", "embed-resource", "notice", "textbox"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com"] }
winapi = { version = "0.3.9", features = ["combaseapi", "objidl", "shobjidl_core", "shlobj", "knownfolders"] }
