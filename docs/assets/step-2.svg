<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-labelledby="title desc">
  <title id="title">設定画面でショートカットを作成</title>
  <desc id="desc">出力先とショートカット名を選び、確認または作成する画面の図</desc>
  <rect width="400" height="230" rx="16" fill="#e7f7f0"/>
  <circle cx="378" cy="-24" r="105" fill="#c9f4e7"/><circle cx="-18" cy="250" r="96" fill="#f8e8dc"/>
  <rect x="20" y="12" width="360" height="206" rx="13" fill="#fbfcfc" stroke="#b6cbc8"/>
  <path d="M33 12h334a13 13 0 0 1 13 13v19H20V25a13 13 0 0 1 13-13Z" fill="#fffdfa"/>
  <path d="M20 44h360" stroke="#dbe7e4"/>
  <rect x="31" y="21" width="14" height="14" rx="4" fill="#c9f4e7"/>
  <path d="M34 26h3l4-3v10l-4-3h-3Z" fill="#fffdfa" stroke="#24495b" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="53" y="32" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="11" fill="#24495b">Audio Shortcut Switch - 設定</text>
  <rect x="37" y="55" width="24" height="24" rx="7" fill="#c9f4e7"/>
  <path d="M42 63h4l6-4v16l-6-4h-4Z" fill="#fffdfa" stroke="#24495b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M55 63q5 4 0 8" fill="none" stroke="#24495b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="69" y="73" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="16" font-weight="600" fill="#24495b">ショートカットを作成</text>
  <text x="38" y="94" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="10" fill="#24495b">出力先</text>
  <rect x="37" y="99" width="257" height="23" rx="5" fill="#fff" stroke="#a8bfbe"/>
  <text x="47" y="115" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="11" fill="#24495b">[Bluetooth] イヤホン</text>
  <path d="m279 108 4 4 4-4" fill="none" stroke="#24495b" stroke-width="1.6"/>
  <rect x="303" y="99" width="59" height="23" rx="5" fill="#f9fbfa" stroke="#a8bfbe"/>
  <text x="333" y="115" text-anchor="middle" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="10" fill="#24495b">再検出</text>
  <text x="38" y="138" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="10" fill="#24495b">ショートカット名</text>
  <rect x="37" y="143" width="325" height="23" rx="5" fill="#fff" stroke="#a8bfbe"/>
  <text x="47" y="159" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="11" fill="#24495b">イヤホンをPCで使う</text>
  <text x="38" y="178" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="9" fill="#5a737c">作成時は音声を切り替えません。</text>
  <rect x="37" y="185" width="76" height="24" rx="5" fill="#f9fbfa" stroke="#a8bfbe"/>
  <text x="75" y="201" text-anchor="middle" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="10" fill="#24495b">接続確認</text>
  <rect x="236" y="185" width="126" height="24" rx="5" fill="#2b796b"/>
  <text x="299" y="201" text-anchor="middle" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="10" font-weight="600" fill="#fff">ショートカットを作成</text>
</svg>
